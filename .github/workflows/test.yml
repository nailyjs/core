name: CI

on:
  push:
    branches:
      - v2
  pull_request:
    branches:
      - v2

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18' # 你可以根据你的项目选择 Node.js 版本

      - name: Install dependencies
        run: npm install -g pnpm && pnpm install

      - name: Run ESLint
        run: pnpm run lint

      - name: Run Vitest tests
        run: pnpm run test
